<!-- =====================================================
     MODALES - NUEVO REPUESTO
===================================================== -->

<!--
    IMPORTANTE:

    Desde el formulario operativo "Nuevo repuesto"
    NO se permite crear:

    - Familias
    - Categorías
    - Atributos técnicos
    - Opciones de atributos
    - Configuraciones Categoría ↔ Atributo

    Esa configuración se administra exclusivamente
    desde el módulo de Maestros.

    Aquí únicamente se conserva la creación rápida
    de MARCAS comerciales.
-->


<!-- =====================================================
     MODAL MARCA
===================================================== -->

<div
    class="modal fade"
    id="modalMarca"
    tabindex="-1"
    aria-labelledby="modalMarcaLabel"
    aria-hidden="true"
>

    <div
        class="
            modal-dialog
            modal-dialog-centered
        "
    >

        <div class="modal-content">


            <!-- =========================================
                 CABECERA
            ========================================== -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalMarcaLabel"
                >
                    Nueva marca
                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Cerrar"
                ></button>

            </div>


            <!-- =========================================
                 CUERPO
            ========================================== -->

            <div class="modal-body">

                <div>

                    <label
                        class="field-label"
                        for="marcaNombre"
                    >
                        Nombre
                    </label>


                    <input
                        id="marcaNombre"
                        type="text"
                        class="form-control-apple"
                        autocomplete="off"
                        maxlength="120"
                        placeholder="Ej: BOSCH"
                    >

                </div>


                <!-- =====================================
                     MENSAJE DE ERROR
                ====================================== -->

                <div
                    id="marcaModalError"
                    style="
                        display:none;
                        margin-top:8px;
                        font-size:9px;
                        font-weight:600;
                        color:var(--danger);
                    "
                ></div>

            </div>


            <!-- =========================================
                 PIE
            ========================================== -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn-login"
                    data-bs-dismiss="modal"
                >
                    Cancelar
                </button>


                <button
                    type="button"
                    class="btn-login primary"
                    id="btnGuardarMarca"
                    onclick="guardarMarca()"
                >

                    <i
                        class="bi bi-check-lg"
                        style="margin-right:4px;"
                    ></i>

                    Guardar

                </button>

            </div>

        </div>

    </div>

</div>
