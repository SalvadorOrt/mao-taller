<div class="producto-compact-grid">


    <!-- CATEGORÍA -->

    <div class="producto-field">

        <label class="field-label">
            Categoría
        </label>

        <div class="field-with-action">

            <div
                class="apple-dropdown"
                data-dropdown-tipo="categoria"
            >

                <input
                    type="text"
                    class="form-control-apple apple-dropdown-input"
                    placeholder="Buscar categoría..."
                    autocomplete="off"
                >

                <input
                    type="hidden"
                    name="categoria"
                    class="apple-dropdown-hidden"
                    value="{{ producto_form.categoria.value|default:'' }}"
                >

                <div class="apple-dropdown-menu">

                    {% for categoria in producto_form.categoria.field.queryset %}

                        <div
                            class="apple-dropdown-item"
                            data-id="{{ categoria.id }}"
                            data-nombre="{{ categoria.nombre }}"
                        >
                            {{ categoria.nombre }}
                        </div>

                    {% endfor %}

                    <div class="apple-dropdown-no-result">
                        Sin coincidencias
                    </div>

                </div>

            </div>


            <button
                type="button"
                class="btn-login btn-mini"
                onclick="abrirModalBootstrap('modalCategoria')"
            >
                +
            </button>

        </div>

        {{ producto_form.categoria.errors }}

    </div>



    <!-- NOMBRE -->

    <div class="producto-field">

        <label class="field-label">
            Nombre base
        </label>

        {{ producto_form.nombre_base }}

        {{ producto_form.nombre_base.errors }}

    </div>



    <!-- DESCRIPCIÓN -->

    <div class="producto-field producto-full">

        <label class="field-label">
            Descripción
        </label>

        {{ producto_form.descripcion }}

        {{ producto_form.descripcion.errors }}

    </div>



    <!-- PARTE INFERIOR -->

    <div class="producto-bottom">


        <div>

            <label class="field-label">
                Imágenes
            </label>

            <input
                type="file"
                id="imagenesProducto"
                name="imagenes_producto"
                class="form-control-apple imagen-input"
                accept="image/*"
                multiple
            >

            <div
                id="previewImagenesProducto"
                class="preview-imagenes"
            ></div>

        </div>


        <div>

            <label class="field-label">
                Estado
            </label>

            <div class="producto-estados">

                <label class="producto-estado-item">
                    {{ producto_form.activo }}
                    Activo
                </label>

                <label class="producto-estado-item">
                    {{ producto_form.datos_incompletos }}
                    Incompleto
                </label>

                <label class="producto-estado-item">
                    {{ producto_form.descontinuado }}
                    Descontinuado
                </label>

            </div>

        </div>

    </div>

</div>
