{% load l10n %}

<style>

    /* =========================================================
       MANO DE OBRA EXTERNA - FACTURACIÓN
       MISMO DISEÑO VISUAL QUE LA OT
    ========================================================= */

    .moe-factura-card,
    .moe-factura-table-wrap {
        overflow: visible !important;
    }

    #tablaMOEFactura {
        width: 100%;
        min-width: 900px;
    }

    #tablaMOEFactura .form-control-apple {
        cursor: default;
    }

    #tablaMOEFactura .form-control-apple[readonly] {
        background-color: #ffffff;
        color: #1d1d1f;
        opacity: 1;
    }

</style>


<!-- =========================================================
     MANO DE OBRA EXTERNA
========================================================= -->

<div class="ot-card moe-factura-card">

    <!-- =====================================================
         TÍTULO
    ====================================================== -->

    <div
        class="section-title"
        style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 10px;
        "
    >

        <span>
            Mano de Obra Externa
        </span>

    </div>


    <!-- =====================================================
         TABLA
    ====================================================== -->

    <div class="ot-table-wrap moe-factura-table-wrap">

        <table
            class="ot-table"
            id="tablaMOEFactura"
        >

            <thead>

                <tr>

                    <th style="width: 18%;">
                        Cód. / Referencia
                    </th>

                    <th style="width: 44%;">
                        Descripción
                    </th>

                    <th style="width: 13%;">
                        P.U.
                    </th>

                    <th style="width: 10%;">
                        Cantidad
                    </th>

                    <th style="width: 15%;">
                        Valor
                    </th>

                </tr>

            </thead>


            <tbody id="cuerpoTablaMOEFactura">

                {% for item in mano_obra_externa %}

                    <tr class="form-readonly">

                        <!-- =====================================
                             CÓDIGO / REFERENCIA
                        ====================================== -->

                        <td class="servicio-cell">

                            <div
                                class="servicio-busqueda-wrap"
                                style="position: relative;"
                            >

                                <input
                                    type="text"
                                    class="
                                        form-control-apple
                                        servicio-busqueda-input
                                    "
                                    value="{% if item.servicio %}{{ item.servicio.codigo }}{% else %}[ MANUAL ]{% endif %}"
                                    readonly
                                    style="
                                        text-align: center;
                                        font-weight: 600;
                                    "
                                >

                            </div>

                        </td>


                        <!-- =====================================
                             DESCRIPCIÓN
                        ====================================== -->

                        <td>

                            <input
                                type="text"
                                class="
                                    form-control-apple
                                    descripcion-manual
                                    descripcion-moe
                                    w-100
                                "
                                value="{{ item.descripcion_servicio|default:'' }}"
                                readonly
                                style="
                                    font-size: 13px;
                                    font-weight: 500;
                                    color: #1d1d1f;
                                    padding: 8px;
                                "
                            >

                        </td>


                        <!-- =====================================
                             PRECIO UNITARIO
                        ====================================== -->

                        <td>

                            <input
                                type="text"
                                class="
                                    form-control-apple
                                    pu
                                "
                                value="{% if item.precio_unitario %}{{ item.precio_unitario|stringformat:'.2f' }}{% else %}0.00{% endif %}"
                                readonly
                            >

                        </td>


                        <!-- =====================================
                             CANTIDAD
                        ====================================== -->

                        <td>

                            <input
                                type="text"
                                class="
                                    form-control-apple
                                    cantidad
                                "
                                value="{% if item.cantidad %}{{ item.cantidad|stringformat:'.2f' }}{% else %}1.00{% endif %}"
                                readonly
                            >

                        </td>


                        <!-- =====================================
                             VALOR
                        ====================================== -->

                        <td>

                            <input
                                type="text"
                                class="
                                    form-control-apple
                                    valor
                                "
                                value="{% if item.subtotal %}{{ item.subtotal|stringformat:'.2f' }}{% else %}0.00{% endif %}"
                                readonly
                            >

                        </td>

                    </tr>


                {% empty %}

                    <tr>

                        <td
                            colspan="5"
                            style="
                                text-align: center;
                                color: #86868b;
                                padding: 14px;
                            "
                        >
                            No hay mano de obra externa registrada.
                        </td>

                    </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>


    <!-- =====================================================
         SUBTOTAL
    ====================================================== -->

    <div class="table-footer-actions">

        <div></div>


        <div class="subtotal-box">

            <div class="subtotal-pill">

                Sub total M.O.E:

                $<span id="subtotalMOEFactura">
                    {{ subtotal_moe|default:"0.00"|floatformat:2 }}
                </span>

            </div>

        </div>

    </div>

</div>
