{% load l10n %}

<style>

    /* =========================================================
       REPUESTOS - FACTURACIÓN
       MISMO LENGUAJE VISUAL QUE LA OT
    ========================================================= */

    #tablaRepuestosFactura {
        width: 100%;
        min-width: 920px;
    }

    #tablaRepuestosFactura tbody tr:empty {
        display: none !important;
    }

    #tablaRepuestosFactura .form-control-apple {
        cursor: default;
    }

    #tablaRepuestosFactura .form-control-apple[readonly] {
        background-color: #ffffff;
        color: #1d1d1f;
        opacity: 1;
    }

    #tablaRepuestosFactura .producto-cell {
        min-width: 300px;
    }

    .factura-item-manual {
        background-color: #f5f5f7 !important;
        color: #86868b !important;

        font-size: 11px !important;
        text-align: center;
        font-weight: 700;
    }

</style>


<!-- =========================================================
     REPUESTOS
========================================================= -->

<div class="ot-card">

    <!-- =====================================================
         TÍTULO
    ====================================================== -->

    <div
        class="section-title"
        style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 10px;
        "
    >

        <span>
            Repuestos
        </span>

    </div>


    <!-- =====================================================
         TABLA
    ====================================================== -->

    <div class="ot-table-wrap">

        <table
            class="ot-table"
            id="tablaRepuestosFactura"
        >

            <thead>

                <tr>

                    <th style="width: 32%;">
                        Producto inventario
                    </th>

                    <th style="width: 30%;">
                        Descripción
                    </th>

                    <th style="width: 13%;">
                        P.U.
                    </th>

                    <th style="width: 10%;">
                        Cantidad
                    </th>

                    <th style="width: 15%;">
                        Valor
                    </th>

                </tr>

            </thead>


            <tbody id="cuerpoTablaRepuestosFactura">

                {% for item in repuestos %}

                    <tr class="form-readonly">

                        <!-- =====================================
                             PRODUCTO
                        ====================================== -->

                        <td class="producto-cell">

                            <div class="producto-busqueda-wrap">

                                {% if item.producto %}

                                    <input
                                        type="text"
                                        class="
                                            form-control-apple
                                            producto-busqueda-input
                                        "
                                        value="{{ item.producto.codigo }} - {{ item.producto.nombre_comercial|default:item.producto.producto.nombre_base }}"
                                        readonly
                                    >

                                {% else %}

                                    <input
                                        type="text"
                                        class="
                                            form-control-apple
                                            factura-item-manual
                                        "
                                        value="[ TEXTO LIBRE / MANUAL ]"
                                        readonly
                                    >

                                {% endif %}

                            </div>

                        </td>


                        <!-- =====================================
                             DESCRIPCIÓN
                        ====================================== -->

                        <td>

                            <input
                                type="text"
                                class="
                                    form-control-apple
                                    descripcion-manual
                                "
                                value="{{ item.descripcion_factura|default:'' }}"
                                readonly
                            >

                        </td>


                        <!-- =====================================
                             PRECIO UNITARIO
                        ====================================== -->

                        <td>

                            <input
                                type="text"
                                class="
                                    form-control-apple
                                    pu
                                "
                                value="{% if item.precio_unitario %}{{ item.precio_unitario|stringformat:'.2f' }}{% else %}0.00{% endif %}"
                                readonly
                            >

                        </td>


                        <!-- =====================================
                             CANTIDAD
                        ====================================== -->

                        <td>

                            <input
                                type="text"
                                class="
                                    form-control-apple
                                    cantidad
                                "
                                value="{% if item.cantidad %}{{ item.cantidad|stringformat:'.2f' }}{% else %}0.00{% endif %}"
                                readonly
                            >

                        </td>


                        <!-- =====================================
                             VALOR
                        ====================================== -->

                        <td>

                            <input
                                type="text"
                                class="
                                    form-control-apple
                                    valor
                                "
                                value="{% if item.subtotal %}{{ item.subtotal|stringformat:'.2f' }}{% else %}0.00{% endif %}"
                                readonly
                            >

                        </td>

                    </tr>


                {% empty %}

                    <tr>

                        <td
                            colspan="5"
                            style="
                                text-align: center;
                                color: #86868b;
                                padding: 14px;
                            "
                        >
                            No hay repuestos registrados.
                        </td>

                    </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>


    <!-- =====================================================
         SUBTOTAL
    ====================================================== -->

    <div class="table-footer-actions">

        <div></div>


        <div class="subtotal-box">

            <div class="subtotal-pill">

                Sub total repuestos:

                $<span id="subtotalRepuestosFactura">
                    {{ subtotal_repuestos|default:"0.00"|floatformat:2 }}
                </span>

            </div>

        </div>

    </div>

</div>
