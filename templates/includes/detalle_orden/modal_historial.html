{% load static %}

<style>
    /* =========================================================
       MODAL HISTORIAL DEL VEHÍCULO - COMPACTO HORIZONTAL
    ========================================================= */

    #modalHistorialOrden {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10060;

        width: 100%;
        height: 100%;

        padding: 12px;
        box-sizing: border-box;

        align-items: center;
        justify-content: center;

        background: rgba(0, 0, 0, 0.58);
        backdrop-filter: blur(4px);
    }

    .historial-orden-dialog {
        width: min(1100px, 96vw);
        height: min(760px, 88vh);
        max-height: 88vh;

        display: flex;
        flex-direction: column;

        overflow: hidden;

        background: #ffffff;
        border: 1px solid var(--border-soft, #efeff2);
        border-radius: 14px;

        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.28);
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .historial-orden-header {
        flex: 0 0 auto;

        min-height: 48px;
        padding: 8px 13px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 10px;

        border-bottom: 1px solid var(--border-soft, #efeff2);
        background: var(--head, #fbfbfd);
    }

    .historial-orden-header-left {
        min-width: 0;

        display: flex;
        align-items: center;

        gap: 8px;
    }

    .historial-orden-icono {
        width: 30px;
        height: 30px;

        flex: 0 0 auto;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 8px;

        background: rgba(0, 113, 227, 0.10);
        color: #0071e3;

        font-size: 0.9rem;
    }

    .historial-orden-titulo-wrap {
        min-width: 0;
    }

    .historial-orden-titulo {
        margin: 0;

        color: var(--primary, #1d1d1f);

        font-size: 0.94rem;
        font-weight: 800;

        line-height: 1.15;
    }

    .historial-orden-subtitulo {
        margin-top: 1px;

        color: var(--muted, #6e6e73);

        font-size: 0.62rem;
        font-weight: 600;

        line-height: 1.2;
    }

    .historial-orden-cerrar {
        width: 30px;
        height: 30px;

        flex: 0 0 auto;

        padding: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        border: 0;
        border-radius: 8px;

        background: transparent;

        color: var(--muted, #6e6e73);

        font-size: 1.25rem;
        line-height: 1;

        cursor: pointer;

        transition:
            background 0.15s ease,
            color 0.15s ease;
    }

    .historial-orden-cerrar:hover {
        background: #f2f2f7;
        color: #111111;
    }

    /* =========================================================
       BODY
    ========================================================= */

    .historial-orden-body {
        flex: 1 1 auto;
        min-height: 0;

        padding: 8px;

        overflow: hidden;

        background: #ffffff;
    }

    #historialOrdenContenido {
        display: none;

        width: 100%;
        height: 100%;

        min-height: 0;
    }

    /* =========================================================
       CARGA / ERROR
    ========================================================= */

    .historial-orden-cargando {
        display: none;

        height: 100%;

        align-items: center;
        justify-content: center;

        flex-direction: column;

        text-align: center;
    }

    .historial-orden-cargando[style*="block"] {
        display: flex !important;
    }

    .historial-orden-spinner {
        width: 28px;
        height: 28px;

        margin-bottom: 9px;

        border: 3px solid #e5e5ea;
        border-top-color: #0071e3;
        border-radius: 50%;

        animation: historialOrdenGirar 0.8s linear infinite;
    }

    @keyframes historialOrdenGirar {
        to {
            transform: rotate(360deg);
        }
    }

    .historial-orden-cargando-texto {
        color: #4a4a4a;

        font-size: 0.76rem;
        font-weight: 700;
    }

    .historial-orden-cargando-ayuda {
        margin-top: 3px;

        color: var(--muted, #6e6e73);

        font-size: 0.63rem;
    }

    .historial-orden-error {
        display: none;

        margin: 4px;
        padding: 10px 12px;

        border: 1px solid rgba(255, 59, 48, 0.22);
        border-radius: 9px;

        background: rgba(255, 59, 48, 0.07);

        color: #c62828;

        font-size: 0.72rem;
        font-weight: 650;
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    .historial-orden-footer {
        flex: 0 0 auto;

        min-height: 42px;
        padding: 7px 12px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 8px;

        border-top: 1px solid var(--border-soft, #efeff2);
        background: var(--head, #fbfbfd);
    }

    .historial-orden-footer-info {
        color: var(--muted, #6e6e73);

        font-size: 0.60rem;
        line-height: 1.25;
    }

    .historial-orden-footer-info i {
        margin-right: 4px;
        color: #0071e3;
    }

    .historial-orden-btn-cerrar {
        height: 30px;
        padding: 0 12px;

        border: 1px solid #d2d2d7;
        border-radius: 7px;

        background: #ffffff;

        color: #1d1d1f;

        font-size: 0.68rem;
        font-weight: 700;

        cursor: pointer;
    }

    .historial-orden-btn-cerrar:hover {
        background: #f5f5f7;
    }

    body.historial-orden-abierto {
        overflow: hidden;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 760px) {
        #modalHistorialOrden {
            padding: 6px;
        }

        .historial-orden-dialog {
            width: 100%;
            height: 94vh;
            max-height: 94vh;

            border-radius: 11px;
        }

        .historial-orden-header {
            padding: 7px 9px;
        }

        .historial-orden-body {
            padding: 6px;
        }

        .historial-orden-footer {
            padding: 6px 9px;
        }
    }

    @media (max-width: 520px) {
        .historial-orden-subtitulo {
            display: none;
        }

        .historial-orden-footer-info {
            display: none;
        }

        .historial-orden-footer {
            justify-content: flex-end;
        }
    }
</style>


<div
    id="modalHistorialOrden"
    data-orden-id="{{ orden.pk }}"
    data-historial-url="{% url 'historial_modal_orden' orden.pk %}"
    aria-hidden="true"
>
    <div
        class="historial-orden-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="historialOrdenTitulo"
    >

        <div class="historial-orden-header">

            <div class="historial-orden-header-left">

                <div class="historial-orden-icono">
                    <i class="bi bi-clock-history"></i>
                </div>

                <div class="historial-orden-titulo-wrap">

                    <h3
                        id="historialOrdenTitulo"
                        class="historial-orden-titulo"
                    >
                        Historial del vehículo
                    </h3>

                    <div class="historial-orden-subtitulo">
                        Visitas anteriores ·
                        {{ orden.placa|upper|default:"SIN PLACA" }}
                    </div>

                </div>

            </div>

            <button
                type="button"
                class="historial-orden-cerrar"
                onclick="cerrarModalHistorialOrden()"
                aria-label="Cerrar"
                title="Cerrar"
            >
                &times;
            </button>

        </div>


        <div class="historial-orden-body">

            <div
                id="historialOrdenCargando"
                class="historial-orden-cargando"
            >
                <div class="historial-orden-spinner"></div>

                <div class="historial-orden-cargando-texto">
                    Consultando historial...
                </div>

                <div class="historial-orden-cargando-ayuda">
                    Cargando visitas y trabajos anteriores.
                </div>
            </div>

            <div
                id="historialOrdenError"
                class="historial-orden-error"
            >
                <i class="bi bi-exclamation-triangle"></i>

                <span id="historialOrdenErrorTexto">
                    No fue posible cargar el historial.
                </span>
            </div>

            <div id="historialOrdenContenido"></div>

        </div>


        <div class="historial-orden-footer">

            <div class="historial-orden-footer-info">
                <i class="bi bi-eye"></i>
                Solo consulta · la OT actual no se modifica
            </div>

            <button
                type="button"
                class="historial-orden-btn-cerrar"
                onclick="cerrarModalHistorialOrden()"
            >
                Cerrar
            </button>

        </div>

    </div>
</div>
