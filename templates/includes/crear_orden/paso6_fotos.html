<div class="step-container" id="step_6">
    <div class="section-header">
        <i class="bi bi-camera text-primary"></i>
        6. Evidencia Fotográfica
    </div>

    <div class="mb-4">
        <label class="form-label-custom">
            REGISTRO VISUAL DEL VEHÍCULO
        </label>

        <div
            class="ot-card"
            style="
                padding: 25px;
                border: 2px dashed #d2d2d7;
                background: #f5f5f7;
                border-radius: 14px;
                text-align: center;
            "
        >
            <i
                class="bi bi-images"
                style="
                    font-size: 2rem;
                    color: #86868b;
                    display: block;
                    margin-bottom: 10px;
                "
            ></i>

            <p
                style="
                    color: #1d1d1f;
                    font-weight: 600;
                    margin-bottom: 15px;
                "
            >
                Captura el estado actual del auto
            </p>

            <input
                type="file"
                name="fotos_recepcion"
                id="id_fotos"
                multiple
                accept="image/*"
                class="d-none"
                onchange="actualizarContadorFotos()"
            >

            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <button
                    type="button"
                    class="btn-mao btn-mao-primary"
                    onclick="document.getElementById('id_fotos').click()"
                >
                    <i class="bi bi-plus-circle me-1"></i>
                    Seleccionar o tomar fotos
                </button>
            </div>

            <p
                class="text-muted small mt-3 mb-0"
                id="contador_fotos"
            >
                <i class="bi bi-info-circle"></i>
                Puede seleccionar imágenes de la galería o tomar fotos
                desde un dispositivo compatible.
            </p>
        </div>

        <div
            id="preview_fotos"
            class="row g-2 mt-3"
        ></div>
    </div>


    <!-- ========================================== -->
    <!-- OBSERVACIÓN DE EVIDENCIA FOTOGRÁFICA -->
    <!-- ========================================== -->
    <div class="mb-3">

        <label
            class="form-label-custom"
            for="id_descripcion_fotos"
        >
            OBSERVACIÓN DE LA EVIDENCIA FOTOGRÁFICA
        </label>

        <textarea
            name="descripcion_fotos"
            id="id_descripcion_fotos"
            class="form-control-apple"
            rows="3"
            maxlength="255"
            placeholder="Ej: El vehículo ingresa empolvado. Se evidencia rayón en guardafango izquierdo..."
        ></textarea>

        <div class="form-text mt-2">
            Esta observación se asociará a las fotografías de recepción
            y aparecerá en el resumen final antes de guardar la OT.
        </div>

    </div>
</div>


<script>
    let fotosSeleccionadas = [];


    function sincronizarInputFotos() {

        const input =
            document.getElementById(
                'id_fotos'
            );

        if (!input) {
            return;
        }

        const dataTransfer =
            new DataTransfer();

        fotosSeleccionadas
            .forEach(
                file => {
                    dataTransfer.items.add(
                        file
                    );
                }
            );

        input.files =
            dataTransfer.files;
    }


    function actualizarContadorFotos() {

        const input =
            document.getElementById(
                'id_fotos'
            );

        if (!input) {
            return;
        }

        const nuevasFotos =
            Array.from(
                input.files || []
            );

        nuevasFotos
            .forEach(
                file => {

                    const existe =
                        fotosSeleccionadas.some(
                            actual =>
                                actual.name === file.name &&
                                actual.size === file.size &&
                                actual.lastModified === file.lastModified
                        );

                    if (!existe) {
                        fotosSeleccionadas.push(
                            file
                        );
                    }
                }
            );

        sincronizarInputFotos();
        actualizarPreviewFotos();

        if (
            typeof programarGuardadoBorradorRecepcion ===
            'function'
        ) {
            programarGuardadoBorradorRecepcion(
                true
            );
        }
    }


    function eliminarFotoSeleccionada(index) {

        if (
            index < 0 ||
            index >= fotosSeleccionadas.length
        ) {
            return;
        }

        fotosSeleccionadas.splice(
            index,
            1
        );

        sincronizarInputFotos();
        actualizarPreviewFotos();

        if (
            typeof programarGuardadoBorradorRecepcion ===
            'function'
        ) {
            programarGuardadoBorradorRecepcion(
                true
            );
        }
    }


    function actualizarPreviewFotos() {

        const contador =
            document.getElementById(
                'contador_fotos'
            );

        const preview =
            document.getElementById(
                'preview_fotos'
            );

        if (
            !contador ||
            !preview
        ) {
            return;
        }

        if (
            fotosSeleccionadas.length === 0
        ) {

            contador.innerHTML = `
                <i class="bi bi-info-circle"></i>
                Puede seleccionar imágenes de la galería o tomar fotos
                desde un dispositivo compatible.
            `;

            preview.innerHTML = '';

            return;
        }


        contador.innerHTML = `
            <b class="text-primary">
                <i class="bi bi-check-circle-fill"></i>
                ${fotosSeleccionadas.length}
                foto(s) seleccionada(s)
            </b>
        `;

        preview.innerHTML = '';


        fotosSeleccionadas
            .forEach(
                (file, index) => {

                    const reader =
                        new FileReader();

                    reader.onload =
                        function (event) {

                            const col =
                                document.createElement(
                                    'div'
                                );

                            col.className =
                                'col-4 col-sm-3 col-md-2';

                            col.innerHTML = `
                                <div
                                    style="
                                        position: relative;
                                        aspect-ratio: 1;
                                        border-radius: 10px;
                                        overflow: hidden;
                                        border: 1px solid #d2d2d7;
                                        background: #f5f5f7;
                                    "
                                >
                                    <img
                                        src="${event.target.result}"
                                        alt="Foto de recepción ${index + 1}"
                                        style="
                                            width: 100%;
                                            height: 100%;
                                            object-fit: cover;
                                            display: block;
                                        "
                                    >

                                    <button
                                        type="button"
                                        onclick="eliminarFotoSeleccionada(${index})"
                                        title="Eliminar foto"
                                        aria-label="Eliminar foto ${index + 1}"
                                        style="
                                            position: absolute;
                                            top: 5px;
                                            right: 5px;
                                            width: 28px;
                                            height: 28px;
                                            border-radius: 50%;
                                            border: none;
                                            background: rgba(0,0,0,0.68);
                                            color: white;
                                            font-size: 17px;
                                            line-height: 1;
                                            display: flex;
                                            align-items: center;
                                            justify-content: center;
                                            cursor: pointer;
                                        "
                                    >
                                        ×
                                    </button>
                                </div>
                            `;

                            preview.appendChild(
                                col
                            );
                        };

                    reader.readAsDataURL(
                        file
                    );
                }
            );
    }
</script>
