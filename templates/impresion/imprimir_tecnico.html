{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>OT {{ orden.numero_orden }} - MAO</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --text: #000000;
            --muted: #000000;
            --line: #000000;
            --soft-2: #ffffff;
            --dark: #000000;
            --danger: #000000;
            --border-radius: 6px;
        }

        @page {
            size: A4 portrait;
            margin: 7mm;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            color: var(--text);
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 10px;
            line-height: 1.3;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .page {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            background: #ffffff;
            padding: 8mm 10mm;
            overflow: hidden;
        }

        .top-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            border: none;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 10px;
            padding-bottom: 8px;
        }

        .top-table td {
            border: none;
            background: #fff;
            vertical-align: top;
            padding: 0;
        }

        .top-left {
            width: 34%;
            padding-right: 8px !important;
        }

        .top-right {
            width: 66%;
            text-align: right;
            overflow: hidden;
        }

        .logo img {
            max-width: 145px;
            max-height: 58px;
            object-fit: contain;
        }

        .company {
            margin-top: 4px;
            font-size: 8.5px;
            line-height: 1.3;
            color: var(--muted);
        }

        .titulo-ot {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.1;
            width: 100%;
            text-align: right;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .numero-ot {
            font-family: 'Montserrat', sans-serif;
            font-size: 8px;
            font-weight: 800;
            color: var(--danger);
            background: var(--soft-2);
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 3px 5px;
            margin-top: 5px;
            width: 100%;
            text-align: right;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .meta-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 4px 0;
            border: none;
            margin-top: 6px;
        }

        .meta-table td {
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 4px;
            text-align: center;
            font-size: 8px;
            background: #fff;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .meta-table span {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: 7px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
        }

        .section {
            margin-bottom: 9px;
        }

        .section-title {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--primary);
        }

        .section-title::after {
            opacity: 1;
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: var(--border-radius);
            background: #ffffff;
            padding: 8px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .field {
            margin-bottom: 5px;
            min-width: 0;
        }

        .label {
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 2px;
            font-size: 7.5px; 
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .value {
            min-height: 22px;
            padding: 4px 7px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #ffffff;
            font-size: 10px; 
            font-weight: 500;
            color: var(--dark);
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .vehicle-row {
            display: block;
        }

        .sketch-box {
            position: relative;
            width: 100%;
            aspect-ratio: 1000 / 158.92;
            border: 1px solid var(--line);
            border-radius: var(--border-radius);
            background: #ffffff !important;
            overflow: hidden;
        }

        .sketch-box img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .img-auto-base {
            z-index: 1;
            background: #ffffff;
        }

        .img-croquis-danios {
            z-index: 2;
            mix-blend-mode: multiply;
        }

        .fuel-box {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-top: 7px;
        }

        .vehicle-checks {
            margin-top: 7px;
        }

        .check-card {
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #ffffff;
            padding: 6px 8px;
        }

        .check-title {
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 4px;
            font-size: 8px; 
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            border-bottom: 1px dashed var(--line);
            padding-bottom: 3px;
        }

        .check-list {
            list-style: none;
        }

        .check-list li {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 2px;
            font-size: 9px;
            color: var(--text);
        }

        .check-box {
            width: 11px;
            height: 11px;
            border: 1.4px solid #cbd5e1;
            border-radius: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 900;
            flex: 0 0 auto;
            background: #fff;
        }

        .check-box.checked {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .check-box.checked::after {
            content: "✓";
        }

        .report {
            min-height: 36px;
            border: 1px solid var(--line);
            border-radius: var(--border-radius);
            background: #ffffff;
            padding: 7px 9px;
            font-size: 10px;
            font-size: 12px;
            line-height: 1.5;
            color: var(--dark);
            overflow-wrap: anywhere;
        }

        .trabajos-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid var(--line);
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        .trabajos-table thead {
            background: var(--primary);
            color: #ffffff;
        }

        .trabajos-table th {
            font-family: 'Montserrat', sans-serif;
            padding: 5px 6px;
            text-align: left;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .trabajos-table td {
            border-bottom: 1px solid var(--line);
            padding: 5px 6px;
            font-size: 9px;
            vertical-align: middle;
            font-weight: 400;
            background: #ffffff;
            overflow-wrap: anywhere;
        }

        .trabajos-table tbody tr:last-child td {
            border-bottom: none;
        }

        .center {
            text-align: center;
        }

        /* =========================================================
           AUTORIZACIÓN DE INGRESO Y RECIBÍ CONFORME
           Ambos bloques permanecen en la primera hoja.
        ========================================================= */
        .legal-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
            margin-top: 6px;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .legal-card {
            border: 1px solid var(--line);
            border-radius: var(--border-radius);
            overflow: hidden;
            background: #ffffff;
            min-width: 0;
        }

        .legal-title {
            padding: 4px 6px;
            background: var(--primary);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 7.2px;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .legal-body {
            padding: 5px 6px 4px;
        }

        .legal-text {
            font-size: 6.4px;
            line-height: 1.18;
            text-align: justify;
        }

        .parking-warning {
            margin-top: 4px;
            padding: 3px 4px;
            border: 1px solid var(--line);
            font-family: 'Montserrat', sans-serif;
            font-size: 6.4px;
            font-weight: 800;
            line-height: 1.15;
            text-align: center;
            text-transform: uppercase;
        }

        .legal-signatures {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 7px;
            margin-top: 5px;
        }

        .legal-signature {
            position: relative;
            min-height: 34px;
            padding-top: 18px;
            border-bottom: 1px solid var(--line);
        }

        .legal-signature-label {
            position: absolute;
            left: 0;
            bottom: 2px;
            width: 100%;
            font-size: 5.8px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
        }

        .legal-name {
            margin-top: 4px;
            font-size: 5.8px;
            line-height: 1.25;
        }

        .legal-name-line {
            display: inline-block;
            width: calc(100% - 31px);
            min-height: 9px;
            border-bottom: 1px dotted var(--line);
            vertical-align: bottom;
        }

        .delivery-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 4px;
            font-size: 5.8px;
        }

        .delivery-meta div {
            min-height: 11px;
            border-bottom: 1px dotted var(--line);
        }

        .digital-signature-wrap {
            position: relative;
        }

        .img-firma {
            position: absolute;
            left: 50%;
            bottom: 12px;
            transform: translateX(-50%);
            max-width: 90%;
            max-height: 32px;
            object-fit: contain;
        }

        @media print {
            body {
                background: #ffffff;
            }

            .page {
                width: auto;
                min-height: auto;
                margin: 0;
                padding: 0;
                box-shadow: none;
                overflow: hidden;
            }

            .panel,
            .section,
            .signatures,
            .vehicle-row {
                page-break-inside: avoid;
                break-inside: avoid;
            }
        }
    </style>
</head>

<body>
<body>

    {% include "impresion/imprimir_tecnico_frontal.html" %}

    {% include "impresion/imprimir_tecnico_trasera.html" %}

    <script>
        (function () {
            "use strict";

            if (window.__maoPrintStarted) {
                return;
            }

            window.__maoPrintStarted = true;

            function abrirImpresionUnaVez() {
                window.setTimeout(function () {
                    window.print();
                }, 500);
            }

            function esperarRecursos() {
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready
                        .then(abrirImpresionUnaVez)
                        .catch(abrirImpresionUnaVez);
                } else {
                    abrirImpresionUnaVez();
                }
            }

            if (document.readyState === "complete") {
                esperarRecursos();
            } else {
                window.addEventListener("load", esperarRecursos, {
                    once: true
                });
            }
        })();
    </script>

</body>
</html>
